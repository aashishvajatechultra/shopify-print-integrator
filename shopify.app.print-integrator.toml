# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "daaee79293e54e00b9fea1ea435cf93b"
name = "Print Integrator"
application_url = "https://shopify-print-integrator-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2024-10"  
 
  [[webhooks.subscriptions]] 
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  topics = [ "app/uninstalled", "products/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_script_tags,write_products,write_script_tags"

[auth] 
redirect_urls = [
  "https://shopify-print-integrator-production.up.railway.app/auth/callback",
  "https://shopify-print-integrator-production.up.railway.app/api/auth"
]


       
