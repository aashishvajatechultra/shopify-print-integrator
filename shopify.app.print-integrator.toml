# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "daaee79293e54e00b9fea1ea435cf93b"
name = "Print Integrator"
application_url = "https://print-integrator-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"
 
  [[webhooks.subscriptions]] 
  uri = "/webhooks"
  topics = [ "products/create", "products/update", "products/delete", "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_script_tags,write_products,write_script_tags"

[auth] 
use_online_tokens = false
redirect_urls = [
  "https://print-integrator-production.up.railway.app/auth/callback",
  "https://print-integrator-production.up.railway.app/api/auth"
]



       
