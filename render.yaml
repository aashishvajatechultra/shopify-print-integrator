services:
  - type: web
    name: shopify-product-designer-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: designer-app-db
          property: connectionString
      - key: ENCRYPTION_STRING
        generateValue: true

databases:
  - name: designer-app-db
    databaseName: shopify_designer
    user: shopify_designer
